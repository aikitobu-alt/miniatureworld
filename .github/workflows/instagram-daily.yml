name: Instagram Daily Post + Auto-reply

on:
  schedule:
    - cron: "0 14 * * *"   # 14:00 UTC daily (~7:30 PM IST) - tweak as you like
  workflow_dispatch:        # allow manual trigger from the Actions tab
    inputs:
      dry_run:
        description: "Generate caption and preview replies without posting"
        required: false
        default: "false"

permissions:
  contents: write            # needed only if we update posted.db in repo

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Configure public media base URL
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          REPO="${GITHUB_REPOSITORY}"
          echo "PUBLIC_MEDIA_BASE_URL=https://raw.githubusercontent.com/${REPO}/${BRANCH}/ig_content" >> $GITHUB_ENV

      - name: Post + Reply
        env:
          GEMINI_API_KEY:        ${{ secrets.GEMINI_API_KEY }}
          IG_USER_ID:            ${{ secrets.IG_USER_ID }}
          META_APP_ID:           ${{ secrets.META_APP_ID }}
          META_LONG_LIVED_TOKEN: ${{ secrets.META_LONG_LIVED_TOKEN }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            igbot daily --dry-run
          else
            igbot daily
          fi

      - name: Commit updated posted.db
        if: ${{ inputs.dry_run != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f data/instagram.db ]; then
            git add data/instagram.db
            git diff --cached --quiet || git commit -m "chore(ig): update posted.db [skip ci]"
            git push || echo "push failed (likely no changes)"
          fi
