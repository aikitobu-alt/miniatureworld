# Pipeline configuration - edit freely
channel:
  name: "My Miniature World"
  handle: "@myminiatureworld4u"
  niche: "miniature farming + satisfying + ASMR faceless shorts"
  description: |
    Tiny farms, tiny tools, tiny harvests. Satisfying miniature-world videos
    where every scene is a bite-sized, ASMR-flavored moment.

style:
  tone: "cozy, wondrous, ASMR, kid-safe"
  voice_description: "soft-spoken, curious, warm, slight whisper"
  video_aesthetic: "photoreal miniature, shallow DOF, golden-hour soft light, tilt-shift feel"
  color_palette: ["sage green", "honey gold", "terracotta", "cream"]

short:
  target_duration_seconds: 38    # keep well under 60s; YT treats <60s + 9:16 as a Short
  resolution: [1080, 1920]
  fps: 30
  num_scenes: 5
  subtitle_font_size: 68
  subtitle_outline: 4

# ============================================================
# FREE STACK (default) - $0 per Short
# ============================================================
providers:
  llm:
    provider: "gemini"             # "gemini" (free) | "openai" (paid)
    model: "gemini-2.5-flash"      # free tier; "gemini-2.0-flash" works when Google enables it for your project
  tts:
    provider: "edge"               # "edge" (free, Microsoft Edge TTS) | "elevenlabs" | "openai" | "none"
    voice_id: "en-US-AriaNeural"   # edge voices: AriaNeural, JennyNeural, GuyNeural, AvaNeural, etc.
    model: "eleven_turbo_v2_5"     # only used when provider=elevenlabs
  video:
    provider: "pollinations"       # "pollinations" (FREE, image+KenBurns) | "kling" | "runway" | "stills"
    kling:
      model: "fal-ai/kling-video/v1.6/standard/text-to-video"
      duration_seconds: 5
    runway:
      model: "gen3a_turbo"
      duration_seconds: 5

# Premium-path recipe (uncomment + swap if/when you have budget):
# providers:
#   llm:    { provider: "openai",     model: "gpt-4o-mini" }
#   tts:    { provider: "elevenlabs", voice_id: "EXAVITQu4vr4xnSDxMaL" }
#   video:  { provider: "kling" }

upload:
  enabled: true
  privacy_status: "public"          # public | unlisted | private
  category_id: "22"                 # 22 = People & Blogs; 24 = Entertainment
  made_for_kids: false
  title_prefix: ""
  default_tags: ["shorts", "miniature", "asmr", "satisfying", "tinyworld"]

cadence:
  uploads_per_day: 1

music:
  bed_volume_db: -18
  voiceover_volume_db: -3
