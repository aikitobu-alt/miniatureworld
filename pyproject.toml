[project]
name = "shorts-pipeline"
version = "0.1.0"
description = "Fully-automated AI YouTube Shorts pipeline: topic -> script -> voiceover -> AI scenes -> stitched MP4 -> scheduled upload."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "openai>=1.40",
    "fal-client>=0.5",
    "elevenlabs>=1.5",
    "google-api-python-client>=2.140",
    "google-auth-httplib2>=0.2",
    "google-auth-oauthlib>=1.2",
    "pyyaml>=6.0",
    "rich>=13.7",
    "pillow>=10.3",
    "tenacity>=8.4",
]

[project.scripts]
shorts = "shorts_pipeline.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["shorts_pipeline*"]

[tool.ruff]
line-length = 100
target-version = "py310"
